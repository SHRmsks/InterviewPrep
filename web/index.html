<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InterviewPrep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/*__STYLE__*/</style>
</head>
<body>
<div class="shell">
  <header class="top" id="top">
    <button type="button" class="brand" data-act="nav" data-view="today">InterviewPrep</button>
    <nav class="tabs" aria-label="Views">
      <button type="button" data-act="nav" data-view="today">Today</button>
      <button type="button" data-act="nav" data-view="decks">Decks</button>
      <button type="button" data-act="nav" data-view="library">Library</button>
      <button type="button" data-act="nav" data-view="insights">Insights</button>
    </nav>
    <button type="button" class="ghost" data-act="settings" aria-label="Settings">Settings</button>
  </header>
  <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>
</div>
<dialog id="settings" aria-label="Settings"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script id="resources" type="application/json">/*__RESOURCES__*/</script>
<script id="wasm" type="text/plain">/*__WASM__*/</script>
<script>/*__SCRIPT__*/</script>
</body>
</html>
